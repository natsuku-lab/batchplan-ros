name: CI

on:
  push:
  pull_request:

env:
  ROS_AUTOMATIC_DISCOVERY_RANGE: LOCALHOST
  CARGO_TERM_COLOR: always

jobs:
  # The node and the browser demo, built and tested without MoveIt.
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.82.0
          cache: true
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: batchplan_ros
      - run: pixi run build
      - name: Lint
        run: pixi run bash -c "cd batchplan_ros && cargo fmt --check && cargo clippy --all-targets -- -D warnings"
      # Google's Rust style guide's rustfmt options that only nightly rustfmt has, as in batchplan.
      - name: Nightly rustfmt
        run: |
          rustup toolchain install nightly --profile minimal -c rustfmt
          cd batchplan_ros && cargo +nightly fmt --check -- --config imports_granularity=Module,hex_literal_case=Lower,format_macro_matchers=true
      - run: pixi run test
      - run: pixi run test-demo

  # The MoveIt plugin, in its own pixi environment.
  moveit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.82.0
          environments: moveit
          cache: true
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: batchplan_ros
      - run: pixi run -e moveit test-moveit
