[package]
name = "batchplan_ros"
version = "0.1.0"
edition = "2024"
description = "A ROS 2 planning node for batchplan: MoveIt planning requests in, timed trajectories out"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "batchplan_planner"
path = "src/main.rs"

[dependencies]
anyhow = "1"
batchplan = "0.3"
futures = "0.3"
rclrs = "0.8"
ros-env = "0.3"
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
serde-saphyr = "1.3"

[lints.clippy]
all = { level = "warn", priority = -1 }
# Rules of Google's Rust style guide that clippy checks, as in batchplan.
wildcard_imports = "warn"
enum_glob_use = "warn"
needless_for_each = "warn"
undocumented_unsafe_blocks = "warn"
format_push_string = "warn"
redundant_clone = "warn"
ref_option = "warn"

[package.metadata.ros]
install_to_share = ["launch"]

# colcon builds the dev profile; planning needs optimized code either way.
[profile.dev]
opt-level = 3

[profile.dev.package."*"]
opt-level = 3

# rclrs 0.8.0 reads rcl_action's return codes as Jazzy's, so on Lyrical a client that leaves ends the
# node (ros2-rust/ros2_rust#730). Until a release has the fix, build that pull request's commit.
[patch.crates-io]
rclrs = { git = "https://github.com/ros2-rust/ros2_rust", rev = "4dfd469bf463367bb3e72b92defe8827dbb3603f" }
